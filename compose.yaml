services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekim_hasat}
      POSTGRES_USER: ${POSTGRES_USER:-ekim_hasat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekim_hasat_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekim_hasat} -d ${POSTGRES_DB:-ekim_hasat}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
